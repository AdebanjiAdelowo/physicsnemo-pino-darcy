[project]
name = "physicsnemo-pino-darcy"
version = "0.1.0"
description = "Physics-weight study of the NVIDIA PhysicsNeMo physics-informed FNO Darcy-flow example"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
authors = [{ name = "Adebanji Adelowo" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
