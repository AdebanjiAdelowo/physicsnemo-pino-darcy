hydra:
  job:
    chdir: True
  run:
    dir: ./outputs_pino

start_lr: 0.001
gamma: 0.99948708
max_epochs: 50

physics_weight: 0.1

model:
  fno:
    in_channels: 1
    out_channels: 1
    decoder_layers: 1
    decoder_layer_size: 32
    dimension: 2
    latent_channels: 32
    num_fno_layers: 4
    num_fno_modes: 12
    padding: 9

# ---------------------------------------------------------------------------
# Everything above this line is conf/config_pino.yaml of
# examples/cfd/darcy_physics_informed, NVIDIA PhysicsNeMo commit
# b45a5c810c741e6b41f8515be24c51121f8fc21f, unchanged. The keys below were
# added by Adebanji Adelowo (2026). Their values in this file reproduce what
# the upstream script hard-codes; smoke.yaml, local.yaml and full.yaml
# override them. The hydra node above is kept for fidelity and is not used:
# the configs are composed with Hydra's compose API (scripts/train.py).
# ---------------------------------------------------------------------------
name: official
device: auto                # auto: CUDA, then Apple MPS, then CPU
output_dir: runs/${name}
batch_size: 1               # DataLoader(dataset, batch_size=1, shuffle=True) upstream

data:
  dir: datasets/Darcy_241
  train_percent: 10         # split_percentage = [10, 10] in download_data.py: samples 0-101
  validation_percent: 10    # samples 102-203
  test_samples: 256         # added split: samples 204-459
  train_samples: null       # null: the whole training split

study:
  # One run per (residual, weight, seed). A weight of 0 is the data-only model and is
  # run once per seed, whatever the residual list.
  residuals: [shipped]      # shipped: forcing and spacing as in the upstream script
  physics_weights: ["${physics_weight}"]
  seeds: [0]                # upstream sets no seed

evaluation:
  plot_samples: 3
  timing_warmup: 3
  timing_repeats: 20
