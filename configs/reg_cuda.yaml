# Regularisation controls for the G2 primary comparison (docs/REGULARISATION_PLAN.md).
# Shared base of the reg_cuda_wd* studies; it is not a study of its own and is in no plan.
# Every training setting is that of full_cuda (data, splits, FNO, batch size 1, start_lr,
# gamma, seeds 0 to 4) except the optimiser node, the snapshots and early stopping. The
# physics-informed comparison model is not retrained: it is consistent_w0.1 of full_cuda and
# full_cuda_more.
defaults:
  - full_cuda
  - _self_

name: reg_cuda
device: cuda

# Budget B (matched compute) in epochs of 102 optimiser steps, fixed by the timing pilot with the
# pre-registered rule (results/audit/regularisation_pilot.json: ratio 1.0277, ceil(50 * 1.0277) = 52).
# Budget A (equal steps) is epoch 50.
max_epochs: 52

optimizer:
  name: adamw               # decoupled weight decay; with weight_decay 0 identical to the upstream Adam
  weight_decay: 0.0

snapshots:
  epochs: [50, 51]          # 50: budget A (5100 optimiser steps); 51: sensitivity of budget B (amendment, see the plan)

evaluation:
  test_after_selection: true  # no test evaluation before results/audit/regularisation_selection.json is final

early_stopping:
  caps: [50, 51, "${max_epochs}"]   # budget A, the epoch-51 sensitivity, budget B
  rules:
    es:                         # early stopping: stop after 5 epochs without a new validation minimum
      patience: 5
      min_delta: 0.0            # relative; any decrease is an improvement
    vb:                         # best validation epoch within the cap (never stops early)
      patience: null
      min_delta: 0.0

study:
  residuals: [consistent]
  physics_weights: [0]
  seeds: [0, 1, 2, 3, 4]
