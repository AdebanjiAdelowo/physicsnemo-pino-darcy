# G5: as labels50.yaml, plus the remaining 52 training-split permeabilities without their pressure
# as inputs of the PDE term (one unlabelled field per optimiser step, in an order of its own). The
# labelled samples, their order and the initial weights are those of labels50 for the same seed.
defaults:
  - labels50
  - _self_

name: labels50_unlabelled

data:
  unlabelled_samples: 52

study:
  physics_weights: [0.1]
